plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.entregador.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.entregador.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
    // We don't use AndroidX internally, just native APIs, but Android Studio expects this basic layout
}
